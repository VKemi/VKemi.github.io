<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0b18">
<link rel="manifest" href="manifest.webmanifest">
<title>Kemerev</title>
<style>
/* ===== Переменные и база ===== */
:root{--bg:#0d0b18;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.09);--text:#f4f2ff;--muted:#9d99bd;
--a1:#8b5cf6;--a2:#22d3ee;--grad:linear-gradient(135deg,#8b5cf6,#22d3ee);
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
font-family:system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;overscroll-behavior:none;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
svg.i{width:24px;height:24px;fill:currentColor;flex:none;pointer-events:none}
.hidden{display:none!important}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;padding-top:var(--sat);
background:radial-gradient(120% 60% at 50% -10%,rgba(139,92,246,.25),transparent 60%),var(--bg)}

/* ===== Шапка ===== */
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 6px}
.logo{font-size:30px;font-weight:800;letter-spacing:.3px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hbtns{display:flex;gap:8px}
.ib{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .15s,background .2s}
.ib:active{transform:scale(.9)}
.ib.sm{width:40px;height:40px}
.ib.grad{background:var(--grad);color:#fff}
.hbtns .ib:not(.grad){background:var(--card)}
.searchbar{padding:0 16px;max-height:0;overflow:hidden;transition:max-height .25s,padding .25s}
.searchbar.show{max-height:64px;padding:6px 16px}
.searchbar input{width:100%;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:0 14px;outline:none}
.searchbar input:focus{border-color:var(--a1)}

/* ===== Табы и панель ===== */
.tabs{display:flex;gap:6px;padding:6px 16px 0}
.tabs button{flex:1;height:44px;border-radius:14px;color:var(--muted);font-weight:600;font-size:14px;transition:.2s}
.tabs button.on{color:#fff;background:var(--card);box-shadow:inset 0 -3px 0 var(--a1)}
.toolbar{display:flex;gap:8px;padding:10px 16px 6px;overflow-x:auto;align-items:center;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:19px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.chip svg.i{width:18px;height:18px}
.chip.g{background:var(--grad);border:0;color:#fff}
.cnt{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap;padding-left:6px}

/* ===== Список ===== */
#list{flex:1;overflow-y:auto;padding:4px 10px calc(110px + var(--sab));overscroll-behavior:contain}
.row{display:flex;align-items:center;gap:12px;padding:8px 6px;border-radius:16px;transition:background .2s;user-select:none;-webkit-user-select:none}
.row:active{background:var(--card)}
.row.playing{background:linear-gradient(90deg,rgba(139,92,246,.25),rgba(34,211,238,.08))}
.row.playing .ttl{color:#c4b5fd}
.row.na{opacity:.5}
.row.sel{background:rgba(139,92,246,.22)}
.cov{position:relative;width:48px;height:48px;border-radius:12px;overflow:hidden;flex:none;background:#222}
.cov img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.92)}
.ph svg.i{width:52%;height:52%}
.meta{flex:1;min-width:0}
.ttl{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heart{color:var(--muted)}
.heart.on{color:#fb7185}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);flex:none;display:flex;align-items:center;justify-content:center;color:transparent}
.chk svg.i{width:16px;height:16px}
.row.sel .chk{background:var(--grad);border-color:transparent;color:#fff}
.eq{position:absolute;inset:0;display:none;align-items:flex-end;justify-content:center;gap:3px;padding-bottom:13px;background:rgba(0,0,0,.45)}
.row.playing .eq{display:flex}
.eq i{width:4px;height:6px;background:#fff;border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
body.paused .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{height:6px}50%{height:20px}}
.empty{text-align:center;padding:60px 24px;color:var(--muted)}
.empty .big{width:96px;height:96px;margin:0 auto 18px;border-radius:28px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff}
.empty .big svg.i{width:48px;height:48px}
.empty p{margin:0 0 18px;line-height:1.5}
.btn{height:48px;padding:0 24px;border-radius:24px;background:var(--grad);color:#fff;font-weight:700}
.plcard{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:16px}
.plcard:active{background:var(--card)}
.plcard .cov{width:56px;height:56px;border-radius:14px}
.plhead{display:flex;align-items:center;gap:6px;padding:0 0 6px}
.plhead .pln{flex:1;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ===== Мини-плеер ===== */
#mini,#selbar{position:fixed;left:10px;right:10px;bottom:calc(var(--sab) + 10px);z-index:20;border-radius:20px;overflow:hidden;
background:rgba(30,26,56,.93);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);
box-shadow:0 10px 30px rgba(0,0,0,.45);transform:translateY(160%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#mini.show,#selbar.show{transform:none}
#selbar{z-index:25;display:flex;align-items:center;gap:6px;padding:8px 10px}
#selbar .sc{flex:1;font-weight:700;font-size:14px;padding-left:6px}
.mprog{height:3px;background:rgba(255,255,255,.12)}
.mprog i{display:block;height:100%;width:0;background:var(--grad)}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 10px}
.mopen{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.mcov{width:46px;height:46px;border-radius:12px;overflow:hidden;flex:none}
.mcov img{width:100%;height:100%;object-fit:cover}
.mt{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms{font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}

/* ===== Полноэкранный плеер ===== */
#full{position:fixed;inset:0;z-index:50;background:var(--bg);transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);overflow:hidden}
#full.open{transform:none}
#fBg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(50px) saturate(1.4);opacity:.5;transform:scale(1.2)}
.fin{position:relative;height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:calc(var(--sat) + 8px) 22px calc(var(--sab) + 20px)}
.ftop{display:flex;align-items:center;justify-content:space-between}
.fh{font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.fcov{width:min(78vw,38vh,340px);aspect-ratio:1;margin:2px auto 0;border-radius:26px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.55);flex:none;background:#222}
.fcov img{width:100%;height:100%;object-fit:cover}
.ftb{display:flex;align-items:center;gap:8px}
.ftxt{flex:1;min-width:0}
.ft{font-size:21px;font-weight:800;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.fa{font-size:14px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;justify-content:space-around}
.acts .ib{background:var(--card)}
.acts .ib.on{color:#fb7185}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;outline:none}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:5px;background:linear-gradient(90deg,var(--a1),var(--a2)) 0 0/var(--p,0%) 100% no-repeat,rgba(255,255,255,.18)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;margin-top:-6.5px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:-2px}
.ctrls{display:flex;align-items:center;justify-content:center;gap:26px}
.ctrls .ib{width:56px;height:56px}
.ctrls .ib svg.i{width:32px;height:32px}
.ctrls .big{width:76px;height:76px;background:var(--grad);box-shadow:0 10px 30px rgba(139,92,246,.5)}
.ctrls .big svg.i{width:40px;height:40px}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mode{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:58px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:11px;font-weight:600;color:var(--muted);transition:.2s}
.mode.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(139,92,246,.4)}
.vol{display:flex;align-items:center;gap:10px;color:var(--muted)}
.vol .chip{flex:none}

/* ===== Шторка, модалка, тосты, загрузка ===== */
#sheetWrap{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s}
#sheetWrap.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#1b1736;border-radius:24px 24px 0 0;padding:14px 10px calc(var(--sab) + 12px);max-height:82vh;overflow-y:auto;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#sheetWrap.open .sheet{transform:none}
.sheet h4{margin:0 12px 8px;font-size:15px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sitem{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;padding:0 12px;border-radius:14px;text-align:left;font-size:15px}
.sitem:active{background:var(--card)}
.sitem span{flex:1}
.sitem em{font-style:normal;color:var(--muted);font-size:13px}
.sitem.danger{color:#fb7185}
.sitem.on{color:#c4b5fd}
#modalWrap{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .2s}
#modalWrap.open{opacity:1;pointer-events:auto}
.modal{width:100%;max-width:380px;background:#1b1736;border-radius:22px;padding:20px;border:1px solid var(--line)}
.modal h3{margin:0 0 12px;font-size:18px}
.modal p{margin:0 0 14px;color:var(--muted);line-height:1.45;font-size:14px}
.modal input{width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:0 14px;outline:none;margin-bottom:14px}
.modal input:focus{border-color:var(--a1)}
.mbtns{display:flex;gap:8px;justify-content:flex-end}
.mbtns button{height:44px;padding:0 18px;border-radius:14px;font-weight:700;background:var(--card)}
.mbtns .ok{background:var(--grad);color:#fff}
.mbtns .ok.danger{background:#e11d48}
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 100px);z-index:90;transform:translate(-50%,20px);background:rgba(40,34,76,.97);border:1px solid var(--line);padding:12px 18px;border-radius:16px;font-size:14px;max-width:88vw;text-align:center;opacity:0;pointer-events:none;transition:.25s}
#toast.show{opacity:1;transform:translate(-50%,0)}
#loader{position:fixed;inset:0;z-index:100;background:rgba(13,11,24,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;opacity:0;pointer-events:none;transition:opacity .2s}
#loader.show{opacity:1;pointer-events:auto}
.spin{width:54px;height:54px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:var(--a2);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.lbar{width:220px;height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}
.lbar i{display:block;height:100%;width:0;background:var(--grad);transition:width .15s}
#loadText{font-size:14px;color:var(--muted);text-align:center;padding:0 20px}
</style>
</head>

<div id="app">
  <header>
    <div class="logo">Kemerev</div>
    <div class="hbtns">
      <button class="ib" id="btnSearch" aria-label="Поиск"><svg class="i"><use href="#i-search"/></svg></button>
      <button class="ib grad" id="btnFolder" aria-label="Добавить музыку"><svg class="i"><use href="#i-folder"/></svg></button>
    </div>
  </header>
  <div class="searchbar" id="searchBar"><input id="q" type="search" placeholder="Поиск по названию…" autocomplete="off"></div>
  <nav class="tabs" id="tabs">
    <button data-tab="all" class="on">Все треки</button>
    <button data-tab="fav">Избранное</button>
    <button data-tab="pl">Плейлисты</button>
  </nav>
  <div class="toolbar" id="toolbar"></div>
  <main id="list"></main>
</div>

<!-- Панель выбора нескольких треков -->
<div id="selbar">
  <button class="ib sm" id="selCancel" aria-label="Отмена"><svg class="i"><use href="#i-close"/></svg></button>
  <div class="sc" id="selCount">0</div>
  <button class="chip" id="selAll">Все</button>
  <button class="ib sm" id="selFav" aria-label="В избранное"><svg class="i"><use href="#i-heart"/></svg></button>
  <button class="chip g" id="selPl"><svg class="i"><use href="#i-pladd"/></svg>В плейлист</button>

<!-- Главное: обычный <audio>, НЕ Web Audio API — иначе Media Session/фон не работают -->
<audio id="audio" preload="auto" playsinline></audio>

<input type="file" id="dirInput" webkitdirectory multiple class="hidden">
<input type="file" id="fileInput" accept="audio/*,.mp3,.m4a,.ogg,.wav,.flac,.opus,.aac" multiple class="hidden">
<input type="file" id="imgInput" accept="image/*" class="hidden">

<script>
(() => {
'use strict';

/* =====================================================================
   0. ПЕРЕКЛЮЧАТЕЛИ
   ===================================================================== */
// На некоторых версиях Android кнопки «±10 сек» в шторке могут вытеснять «пред/след».
// Если нужны — поставьте true.
const ENABLE_SEEK_BUTTONS = false;

/* =====================================================================
   1. УТИЛИТЫ
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic = n => `<svg class="i"><use href="#i-${n}"/></svg>`;
const fmt = s => { if (!isFinite(s) || s < 0) s = 0; s = Math.floor(s); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const coll = new Intl.Collator('ru', { numeric: true, sensitivity: 'base' });
const tick = () => new Promise(r => setTimeout(r, 0));

// Безопасная работа с localStorage
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};

let toastTimer = null;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

/* =====================================================================
   2. IndexedDB — хранилище файлов-копий и обложек
   (localStorage ~5 МБ не хватит ни на музыку, ни на много картинок)
   ===================================================================== */
let dbp = null;
function db() {
  return dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('kemerev', 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('files'); d.createObjectStore('covers'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
}
async function idb(store, mode, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const tx = d.transaction(store, mode); const rq = fn(tx.objectStore(store));
    tx.oncomplete = () => res(rq && rq.result);
    tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
  });
}
const idbGet = (s, k) => idb(s, 'readonly', st => st.get(k));
const idbPut = (s, k, v) => idb(s, 'readwrite', st => st.put(v, k));
const idbDel = (s, k) => idb(s, 'readwrite', st => st.delete(k));
const idbKeys = s => idb(s, 'readonly', st => st.getAllKeys());

/* =====================================================================
   3. СОСТОЯНИЕ
   ===================================================================== */
let tracks = LS.get('kem.tracks', []);       // метаданные треков (без файлов и без картинок)
let playlists = LS.get('kem.playlists', []); // [{id,name,ids:[]}]
const settings = Object.assign({
  volume: 1, repeat: 'none', shuffle: false, rate: 1, sort: 'name',
  keep: true, lastId: null, lastPos: 0, lastCtx: 'all'
}, LS.get('kem.settings', {}));

const files = new Map();       // id -> File (выбран в этой сессии)
const covers = new Map();      // id -> dataURL (JPEG)
const storedIds = new Set();   // id треков, чьи копии лежат в IndexedDB
let tmap = new Map();
const reindex = () => { tmap = new Map(tracks.map(t => [t.id, t])); };
const byId = id => tmap.get(id);
const plById = id => playlists.find(p => p.id === id);
const saveTracks = () => { if (!LS.set('kem.tracks', tracks)) toast('Не удалось сохранить список (память браузера заполнена)'); };
const savePl = () => LS.set('kem.playlists', playlists);
const saveSettings = () => LS.set('kem.settings', settings);

const tTitle = t => t.custom || t.name;
const tArtist = t => t.artist || 'Kemerev';
const hue = id => { let h = 0; for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) % 360; return h; };
const grad = id => { const h = hue(id); return `linear-gradient(135deg,hsl(${h},70%,55%),hsl(${(h + 55) % 360},75%,38%))`; };

let view = { tab: 'all', pl: null, q: '' };
const sel = { on: false, ids: new Set() };

/* =====================================================================
   4. ИМПОРТ: папка / файлы
   ===================================================================== */
const AUDIO_RE = /\.(mp3|m4a|ogg|oga|opus|wav|flac|aac)$/i;
const isAudio = f => AUDIO_RE.test(f.name) || (f.type && f.type.startsWith('audio/'));

// «Исполнитель - Название.mp3» -> {artist,title}
function parseName(fname) {
  let n = fname.replace(/\.[^.]+$/, '').replace(/_/g, ' ').trim();
  let artist = '', title = n;
  const m = n.match(/^(.+?)\s+[-–—]\s+(.+)$/);
  if (m) { artist = m[1].trim(); title = m[2].trim(); }
  title = title.replace(/^\d{1,3}[.)\s-]+(?=\D)/, '').trim() || n;
  return { artist, title };
}

// Длительность читаем через <audio> (с таймаутом)
function readDuration(file) {
  return new Promise(res => {
    const a = new Audio(); a.preload = 'metadata';
    const u = URL.createObjectURL(file); let done = false;
    const fin = d => { if (done) return; done = true; clearTimeout(to); a.removeAttribute('src'); a.load(); URL.revokeObjectURL(u); res(isFinite(d) ? d : 0); };
    const to = setTimeout(() => fin(0), 5000);
    a.onloadedmetadata = () => fin(a.duration); a.onerror = () => fin(0); a.src = u;
  });
}

function showLoader(text) { $('#loadText').textContent = text; $('#loadBar').style.width = '0'; $('#loader').classList.add('show'); }
function setLoader(i, n, text) { $('#loadBar').style.width = (i / n * 100) + '%'; $('#loadText').textContent = text; }
function hideLoader() { $('#loader').classList.remove('show'); }

async function importFiles(list) {
  const arr = list.filter(isAudio);
  if (!arr.length) { toast('Аудиофайлы не найдены'); return; }
  showLoader('Сканирование…');
  let added = 0, quotaFail = false;
  for (let i = 0; i < arr.length; i++) {
    const f = arr[i]; const id = f.name + '|' + f.size;
    files.set(id, f);
    let t = byId(id);
    if (!t) {
      const p = parseName(f.name);
      const parts = (f.webkitRelativePath || '').split('/');
      t = { id, name: p.title, artist: p.artist, folder: parts.length > 1 ? parts[parts.length - 2] : '', custom: null, dur: 0, fav: false, added: Date.now() + i };
      tracks.push(t); tmap.set(id, t); added++;
    }
    if (!t.dur) t.dur = await readDuration(f);
    if (settings.keep && !storedIds.has(id) && !quotaFail) {
      try { await idbPut('files', id, f); storedIds.add(id); } catch (e) { quotaFail = true; }
    }
    setLoader(i + 1, arr.length, `Обработано ${i + 1} из ${arr.length}`);
    if (i % 5 === 0) await tick();
  }
  saveTracks(); hideLoader(); render();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  toast(quotaFail ? 'Не хватило места для копий — часть треков доступна только в этой сессии'
        : added ? `Папка загружена: +${added} трек(ов)` : 'Список обновлён');
}

/* =====================================================================
   5. ПЛЕЕР
   ===================================================================== */
const audio = $('#audio');
let cur = null;                  // текущий трек
let baseQueue = [], queue = [], qpos = -1, ctx = 'all';
let curUrl = null, loadSeq = 0, pendingSeek = 0, errStreak = 0, seeking = false;
let sleepAt = 0, sleepTrack = false;

const applyLoop = () => { audio.loop = settings.repeat === 'one' && !sleepTrack; }; // «повтор трека» — нативный loop, работает и при выключенном экране

async function getBlob(id) {
  if (files.has(id)) return files.get(id);
  if (storedIds.has(id)) { try { return await idbGet('files', id); } catch (e) { return null; } }
  return null;
}

function shuffleArr(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// Строим очередь: при shuffle текущий трек ставим первым
function buildQueue(anchorId) {
  queue = baseQueue.slice();
  if (settings.shuffle) {
    shuffleArr(queue);
    const i = anchorId ? queue.indexOf(anchorId) : -1;
    if (i > 0) { queue.splice(i, 1); queue.unshift(anchorId); }
  }
  qpos = anchorId ? queue.indexOf(anchorId) : -1;
}

async function loadTrack(id, { play = true, pos = 0 } = {}) {
  const t = byId(id); if (!t) return false;
  const my = ++loadSeq;
  const blob = await getBlob(id);
  if (my !== loadSeq) return false;
  if (!blob) { toast('Файл недоступен — выберите папку заново'); return false; }
  if (curUrl) URL.revokeObjectURL(curUrl);
  curUrl = URL.createObjectURL(blob);
  cur = t; qpos = queue.indexOf(id); pendingSeek = pos || 0;
  audio.src = curUrl; applyLoop();
  audio.defaultPlaybackRate = settings.rate; audio.playbackRate = settings.rate; // src сбрасывает скорость
  updateMedia();                       // метаданные ДО play()
  settings.lastId = id; settings.lastCtx = ctx; settings.lastPos = pos || 0; saveSettings();
  sync(); markPlaying();
  if (play) { try { await audio.play(); } catch (e) { /* AbortError при быстрой смене — нормально */ } }
  return true;
}

function playFrom(id, ids, key) {
  baseQueue = ids.slice(); ctx = key; buildQueue(id);
  return loadTrack(id, { play: true });
}

async function next(auto) {
  if (!queue.length) return;
  let n = qpos + 1;
  if (n >= queue.length) {
    if (settings.repeat === 'all') { if (settings.shuffle) buildQueue(null); n = 0; }
    else if (auto) { audio.pause(); audio.currentTime = 0; return; } // конец списка — стоп
    else n = 0;
  }
  await loadTrack(queue[n], { play: true });
}

async function prev() {
  if (!queue.length) return;
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  let n = qpos - 1;
  if (n < 0) { if (settings.repeat === 'all') n = queue.length - 1; else { audio.currentTime = 0; return; } }
  await loadTrack(queue[n], { play: true });
}

function togglePlay() {
  if (!cur) {
    const l = viewTracks();
    if (l.length) playFrom(l[0].id, l.map(x => x.id), ctxKey()); else toast('Сначала добавьте музыку');
    return;
  }
  if (audio.paused) audio.play().catch(() => {}); else audio.pause();
}

/* ---- События <audio> ---- */
let lastPosPush = 0, lastSave = 0;
audio.addEventListener('timeupdate', () => {
  syncTime();
  const now = Date.now();
  if (now - lastPosPush > 1000) { lastPosPush = now; updatePos(); }     // прогресс-бар в шторке
  if (now - lastSave > 3000) { lastSave = now; settings.lastPos = audio.currentTime; saveSettings(); }
  if (sleepAt && now >= sleepAt) { sleepAt = 0; audio.pause(); toast('Таймер сна: пауза'); }
});
audio.addEventListener('play', () => { errStreak = 0; syncPlayIcons(); markPlaying(); if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing'; updatePos(); });
audio.addEventListener('pause', () => { syncPlayIcons(); markPlaying(); if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused'; updatePos(); settings.lastPos = audio.currentTime; saveSettings(); });
audio.addEventListener('loadedmetadata', () => {
  if (pendingSeek && isFinite(audio.duration)) { audio.currentTime = Math.min(pendingSeek, audio.duration - 0.5); pendingSeek = 0; }
  if (cur && isFinite(audio.duration) && Math.abs((cur.dur || 0) - audio.duration) > 1) { cur.dur = audio.duration; saveTracks(); }
  syncTime(); updatePos();
});
['seeked', 'ratechange', 'durationchange'].forEach(ev => audio.addEventListener(ev, updatePos));
audio.addEventListener('ended', () => {
  if (sleepTrack) { sleepTrack = false; applyLoop(); audio.pause(); toast('Таймер сна: пауза'); return; }
  if (settings.repeat === 'one') { audio.currentTime = 0; audio.play().catch(() => {}); return; }
  next(true);
});
audio.addEventListener('error', () => {
  if (!cur || !audio.src) return;
  toast('Не удалось воспроизвести трек');
  if (++errStreak < Math.max(queue.length, 2)) setTimeout(() => next(true), 600);
});

/* =====================================================================
   6. MEDIA SESSION — мини-плеер в шторке уведомлений
   ===================================================================== */
const artCache = new Map();
// Если обложки нет — рисуем градиент с нотой (иначе в шторке будет пустая картинка)
function placeholderArt(id) {
  if (artCache.has(id)) return artCache.get(id);
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d'); const h = hue(id);
  const gr = g.createLinearGradient(0, 0, 512, 512);
  gr.addColorStop(0, `hsl(${h},70%,55%)`); gr.addColorStop(1, `hsl(${(h + 55) % 360},75%,38%)`);
  g.fillStyle = gr; g.fillRect(0, 0, 512, 512);
  g.fillStyle = 'rgba(255,255,255,.92)'; g.translate(256 - 14 * 16, 256 - 12 * 16); g.scale(16, 16);
  try { g.fill(new Path2D('M12 3v10.55A4 4 0 1014 17V7h4V3h-6z')); } catch (e) {}
  const url = c.toDataURL('image/jpeg', 0.85);
  artCache.set(id, url); return url;
}

function updateMedia() {
  if (!('mediaSession' in navigator)) return;
  if (!cur) { navigator.mediaSession.metadata = null; return; }
  const src = covers.get(cur.id) || placeholderArt(cur.id);
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: tTitle(cur), artist: tArtist(cur), album: cur.folder || 'Kemerev',
      artwork: [96, 192, 512].map(s => ({ src, sizes: s + 'x' + s, type: 'image/jpeg' }))
    });
  } catch (e) { console.warn('MediaMetadata', e); }
}

function updatePos() {
  if (!('mediaSession' in navigator) || !navigator.mediaSession.setPositionState) return;
  const d = audio.duration; if (!isFinite(d) || d <= 0) return;
  try { navigator.mediaSession.setPositionState({ duration: d, playbackRate: audio.playbackRate || 1, position: Math.min(Math.max(audio.currentTime, 0), d) }); } catch (e) {}
}

function initMediaSession() {
  if (!('mediaSession' in navigator)) return;
  const H = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch (e) {} };
  H('play', () => { if (!cur) togglePlay(); else audio.play().catch(() => {}); });
  H('pause', () => audio.pause());
  H('previoustrack', () => prev());
  H('nexttrack', () => next(false));
  H('seekto', d => { if (d.fastSeek && 'fastSeek' in audio) audio.fastSeek(d.seekTime); else audio.currentTime = d.seekTime; updatePos(); });
  H('stop', () => { audio.pause(); audio.currentTime = 0; });
  if (ENABLE_SEEK_BUTTONS) {
    H('seekbackward', d => { audio.currentTime = Math.max(0, audio.currentTime - (d.seekOffset || 10)); updatePos(); });
    H('seekforward', d => { audio.currentTime = Math.min(audio.duration || 1e9, audio.currentTime + (d.seekOffset || 10)); updatePos(); });
  }
}

/* =====================================================================
   7. СПИСКИ, РЕНДЕР
   ===================================================================== */
const sorters = {
  name: (a, b) => coll.compare(tTitle(a), tTitle(b)),
  added: (a, b) => b.added - a.added,
  dur: (a, b) => a.dur - b.dur
};
const sortNames = { name: 'А–Я', added: 'Новые', dur: 'По длине' };

function viewTracks() {
  let l;
  if (view.tab === 'fav') l = tracks.filter(t => t.fav);
  else if (view.tab === 'pl' && view.pl) { const p = plById(view.pl); l = p ? p.ids.map(byId).filter(Boolean) : []; }
  else l = tracks.slice();
  const q = view.q.trim().toLowerCase();
  if (q) l = l.filter(t => (tTitle(t) + ' ' + tArtist(t) + ' ' + t.name).toLowerCase().includes(q));
  if (view.tab !== 'pl') l.sort(sorters[settings.sort] || sorters.name);
  return l;
}
const ctxKey = () => (view.tab === 'pl' && view.pl) ? 'pl:' + view.pl : (view.tab === 'fav' ? 'fav' : 'all');
function ctxIds(key) {
  let l;
  if (key === 'fav') l = tracks.filter(t => t.fav).sort(sorters[settings.sort]);
  else if (key.startsWith('pl:')) { const p = plById(key.slice(3)); l = p ? p.ids.map(byId).filter(Boolean) : []; }
  else l = tracks.slice().sort(sorters[settings.sort]);
  return l.map(t => t.id);
}

function covHTML(t) {
  return covers.has(t.id) ? `<img alt="" src="${covers.get(t.id)}">` : `<div class="ph" style="background:${grad(t.id)}">${ic('note')}</div>`;
}
function rowHTML(t) {
  const avail = files.has(t.id) || storedIds.has(t.id);
  return `<div class="row${avail ? '' : ' na'}${sel.ids.has(t.id) ? ' sel' : ''}" data-id="${esc(t.id)}">`
    + (sel.on ? `<div class="chk">${ic('check')}</div>` : '')
    + `<div class="cov">${covHTML(t)}<span class="eq"><i></i><i></i><i></i></span></div>`
    + `<div class="meta"><div class="ttl">${esc(tTitle(t))}</div><div class="sub">${esc(tArtist(t))}${t.dur ? ' · ' + fmt(t.dur) : ''}${avail ? '' : ' · нет файла'}</div></div>`
    + `<button class="ib sm heart${t.fav ? ' on' : ''}" data-a="fav" aria-label="Избранное">${ic(t.fav ? 'heart-f' : 'heart')}</button>`
    + `<button class="ib sm" data-a="more" aria-label="Действия">${ic('more')}</button></div>`;
}
function refreshRow(t) {
  const r = $(`#list .row[data-id="${CSS.escape(t.id)}"]`);
  if (r) { r.outerHTML = rowHTML(t); markPlaying(); }
}

function emptyHTML() {
  if (!tracks.length) return `<div class="empty"><div class="big">${ic('note')}</div><p>Здесь пока пусто.<br>Выберите папку с музыкой на телефоне.</p><button class="btn" data-a="pick">Выбрать папку</button></div>`;
  if (view.tab === 'fav') return `<div class="empty"><p>В избранном пока ничего нет.<br>Нажмите ♡ у любого трека.</p></div>`;

// Картинка -> квадрат 512x512 JPEG 0.8 (экономим место)
function resizeImage(file, size = 512) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d');
      const s = Math.min(img.width, img.height), sx = (img.width - s) / 2, sy = (img.height - s) / 2;
      g.drawImage(img, sx, sy, s, s, 0, 0, size, size);
      URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('img')); };
    img.src = u;
  });
}

}

/* ---- Воспроизвести всё / перемешать ---- */
function playAll(shuf, key) {
  key = key || ctxKey();
  const ids = key === ctxKey() ? viewTracks().map(t => t.id) : ctxIds(key);
  if (!ids.length) { toast('Нет треков'); return; }
  settings.shuffle = !!shuf; saveSettings(); syncModes();
  baseQueue = ids.slice(); ctx = key;
  const first = shuf ? ids[Math.floor(Math.random() * ids.length)] : ids[0];
  buildQueue(first); loadTrack(first, { play: true });
}

$('#selCancel').onclick = exitSel;
$('#selAll').onclick = () => { viewTracks().forEach(t => sel.ids.add(t.id)); updateSel(); render(); };
$('#selFav').onclick = () => { if (!sel.ids.size) return; sel.ids.forEach(id => { const t = byId(id); if (t) t.fav = true; }); saveTracks(); toast('Добавлено в избранное'); exitSel(); };
$('#selPl').onclick = () => { if (!sel.ids.size) { toast('Выберите треки'); return; } pickPlaylist([...sel.ids]); };

// --- Мини-плеер ---
$('#mOpen').onclick = openFull;
$('#mPlay').onclick = togglePlay;
$('#mNext').onclick = () => next(false);

// --- Полноэкранный плеер ---
$('#fClose').onclick = closeFull;
$('#fPlay').onclick = togglePlay;
$('#fNext').onclick = () => next(false);
$('#fPrev').onclick = prev;
$('#fFav').onclick = () => { if (cur) toggleFav(cur); };
$('#fEdit').onclick = () => { if (cur) renameTrack(cur); };
$('#fImg').onclick = () => { if (cur) coverMenu(cur); };
$('#fPl').onclick = () => { if (cur) pickPlaylist([cur.id]); };
$('#fSleep').onclick = sleepMenu;
$('#rate').onclick = cycleRate;
$('#mdNone').onclick = () => { settings.repeat = 'none'; applyLoop(); saveSettings(); syncModes(); toast('Обычный режим'); };
$('#mdAll').onclick = () => setRepeat('all');
$('#mdOne').onclick = () => setRepeat('one');
$('#mdShuf').onclick = toggleShuffle;
$('#vol').addEventListener('input', e => { settings.volume = +e.target.value; audio.volume = settings.volume; e.target.style.setProperty('--p', settings.volume * 100 + '%'); saveSettings(); });

// Перемотка
const seekEl = $('#seek');
seekEl.addEventListener('input', () => {
  seeking = true; const d = isFinite(audio.duration) ? audio.duration : (cur ? cur.dur : 0);
  $('#fCur').textContent = fmt(seekEl.value / 1000 * d); seekEl.style.setProperty('--p', seekEl.value / 10 + '%');
});
seekEl.addEventListener('change', () => {
  if (isFinite(audio.duration)) audio.currentTime = seekEl.value / 1000 * audio.duration;
  seeking = false; updatePos();
});

document.addEventListener('visibilitychange', () => { if (!document.hidden) { syncTime(); markPlaying(); } });

/* =====================================================================
   11. ЗАПУСК
   ===================================================================== */
async function init() {
  reindex(); audio.volume = settings.volume; applyLoop();
  audio.defaultPlaybackRate = settings.rate; audio.playbackRate = settings.rate;
  initMediaSession();
  render(); sync();
  try {
    const keys = await idbKeys('files'); keys.forEach(k => storedIds.add(k));
    await new Promise(res => {   // подгружаем обложки в память
      db().then(d => {
        const tx = d.transaction('covers', 'readonly'); const rq = tx.objectStore('covers').openCursor();
        rq.onsuccess = () => { const c = rq.result; if (c) { covers.set(c.key, c.value); c.continue(); } };
        tx.oncomplete = res; tx.onerror = res; tx.onabort = res;
      }).catch(res);
    });
  } catch (e) { console.warn('IndexedDB недоступна', e); }
  render();
  // Восстанавливаем последний трек (без автозапуска) с сохранённой позиции
  if (settings.lastId && byId(settings.lastId)) {
    ctx = settings.lastCtx || 'all'; baseQueue = ctxIds(ctx);
    if (!baseQueue.includes(settings.lastId)) { ctx = 'all'; baseQueue = ctxIds('all'); }
    buildQueue(settings.lastId);
    await loadTrack(settings.lastId, { play: false, pos: settings.lastPos || 0 });
  }
  // Офлайн-режим при установке из Chrome (нужен https и файл sw.js рядом)
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
}
init();
})();
</script>
